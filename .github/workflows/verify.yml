name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.9.1
          cache: false
      - name: Record OS process prerequisites
        run: |
          git --version
          python3 --version
      - name: Install Linux sandbox prerequisite
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bubblewrap apparmor
          sudo apparmor_parser -r .github/bwrap.apparmor
      - name: Verify the deployed Runner policy around the inner sandbox
        run: |
          sudo useradd --system --user-group --shell /usr/sbin/nologin wiki-runner
          sudo install -d -m 0700 /etc/personal-wiki /var/lib/personal-wiki-accounting /var/lib/personal-wiki-staging /var/lib/personal-wiki-production /var/lib/personal-wiki-deploy
          sudo install -d -m 0700 -o wiki-runner -g wiki-runner /var/lib/personal-wiki-runner
          sudo python3 ops/deploy/check-sandbox.py
      - name: Frozen install
        run: mise exec -- bun install --frozen-lockfile
      - name: Install pinned browser and system dependencies
        run: mise exec -- bunx --no-install playwright install --with-deps chromium
      - name: Deterministic verification including Linux process probes
        run: mise exec -- bun run verify
      - name: Require unchanged generated files and lockfile
        run: git diff --exit-code
      - name: Exercise the Linux release package without provider credentials
        run: |
          mise exec -- python3 ops/release/package.py "$RUNNER_TEMP/package-smoke"
          python3 ops/release/smoke.py "$RUNNER_TEMP/package-smoke/payload"
