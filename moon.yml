language: typescript
toolchains:
  default: [javascript, bun]
tasks:
  typecheck:
    options:
      cache: false
    command: bun run typecheck
  diagnostics:
    options:
      cache: false
    command: bun run effect-check
  lint:
    options:
      cache: false
    command: bun run lint
  format:
    options:
      cache: false
    command: bun run format-check
  contracts:
    options:
      cache: false
    command: bun run tools/contracts.ts --check
  test:
    options:
      cache: false
    command: bun test
    deps: [knowledge-service:build, runner:build, web:build]
  deployment:
    options:
      cache: false
    command: python3 -m unittest discover -s tests/deployment -v
  backup:
    options:
      cache: false
    command: python3 -m unittest discover -s tests/backup -v
  browser:
    options:
      cache: false
    command: bun run browser-test
    deps: [web:build, runner:build]
  negative:
    options:
      cache: false
    command: bun run tools/negative-check.ts
  verify:
    options:
      cache: false
    command: bun run tools/verified.ts
    deps:
      [typecheck, diagnostics, lint, format, contracts, test, negative, browser, deployment, backup]
